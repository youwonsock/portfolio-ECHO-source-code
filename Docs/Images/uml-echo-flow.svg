<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Echo Wave Processing Sequence</title>
  <desc id="desc">Sequence from sound event and Echo acquisition through shader update and pool return.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 24px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}
      .actor{fill:#dbeafe;stroke:#334155;stroke-width:2;rx:7}
      .name{font:700 16px Consolas,monospace;fill:#0f172a;text-anchor:middle}
      .life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 7}
      .msg{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .return{stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .label{font:14px Arial,'Noto Sans KR',sans-serif;fill:#334155;text-anchor:middle}
      .note{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;rx:6}
      .noteText{font:13px Arial,'Noto Sans KR',sans-serif;fill:#78350f;text-anchor:middle}
    </style>
  </defs>
  <rect width="1100" height="570" fill="#f8fafc"/>
  <text class="title" x="550" y="36" text-anchor="middle">Echo Wave Processing Sequence</text>

  <g><rect class="actor" x="35" y="65" width="170" height="48"/><text class="name" x="120" y="95">Sound Event</text></g>
  <g><rect class="actor" x="255" y="65" width="170" height="48"/><text class="name" x="340" y="95">ObjectPool</text></g>
  <g><rect class="actor" x="475" y="65" width="150" height="48"/><text class="name" x="550" y="95">Echo</text></g>
  <g><rect class="actor" x="675" y="65" width="170" height="48"/><text class="name" x="760" y="95">GameManager</text></g>
  <g><rect class="actor" x="895" y="65" width="170" height="48"/><text class="name" x="980" y="95">Ground/Number</text></g>

  <line class="life" x1="120" y1="113" x2="120" y2="520"/>
  <line class="life" x1="340" y1="113" x2="340" y2="520"/>
  <line class="life" x1="550" y1="113" x2="550" y2="520"/>
  <line class="life" x1="760" y1="113" x2="760" y2="520"/>
  <line class="life" x1="980" y1="113" x2="980" y2="520"/>

  <line class="msg" x1="120" y1="155" x2="332" y2="155"/><text class="label" x="230" y="145">Get(PoolingType)</text>
  <line class="msg" x1="340" y1="205" x2="542" y2="205"/><text class="label" x="445" y="195">Activate(transform)</text>
  <rect class="note" x="462" y="235" width="176" height="50"/><text class="noteText" x="550" y="255">FixedUpdateWork</text><text class="noteText" x="550" y="274">Interpolate radius</text>
  <line class="msg" x1="550" y1="315" x2="752" y2="315"/><text class="label" x="655" y="305">UpdateEcho(...)</text>
  <line class="msg" x1="760" y1="365" x2="972" y2="365"/><text class="label" x="870" y="355">Set position · radius arrays</text>
  <rect class="note" x="878" y="395" width="204" height="50"/><text class="noteText" x="980" y="415">Distance-based wave</text><text class="noteText" x="980" y="434">and highlight color</text>
  <line class="return" x1="550" y1="480" x2="348" y2="480"/><text class="label" x="445" y="470">Deactivate → Return</text>
</svg>
